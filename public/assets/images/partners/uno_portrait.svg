<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B2A" />
      <stop offset="100%" stop-color="#1A2618" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA68" />
      <stop offset="100%" stop-color="#9E7D34" />
    </linearGradient>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="80" cy="80" r="78" fill="url(#warmBg)" />

  <!-- Inner Subtle Ring -->
  <circle cx="80" cy="80" r="66" fill="none" stroke="#C5A059" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Monogram Identity Motif: UN -->
  <text
    x="80"
    y="91"
    fill="#DFBA68"
    font-family="'Space Grotesk', 'Outfit', sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="2"
    text-anchor="middle"
  >UN</text>

  <!-- Editorial Subtitle: VERIFIED HOST -->
  <text
    x="80"
    y="114"
    fill="#C5A059"
    font-family="'Inter', sans-serif"
    font-size="8.5"
    font-weight="700"
    letter-spacing="3"
    text-anchor="middle"
    opacity="0.85"
  >VERIFIED HOST</text>

  <!-- Editorial Gold Border Rim -->
  <circle cx="80" cy="80" r="77" fill="none" stroke="url(#goldRim)" stroke-width="2.5" />
</svg>
