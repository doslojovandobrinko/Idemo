<svg width="400" height="350" viewBox="0 0 400 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradients -->
  <defs>
    <!-- Suitcase body gradient -->
    <linearGradient id="suitcase-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5F44" />
      <stop offset="50%" stop-color="#1E442F" />
      <stop offset="100%" stop-color="#122B1E" />
    </linearGradient>
    <linearGradient id="suitcase-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A7555" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E442F" stop-opacity="0"/>
    </linearGradient>
    <!-- Leather strap gradient -->
    <linearGradient id="strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#703E1A" />
      <stop offset="50%" stop-color="#8F5428" />
      <stop offset="100%" stop-color="#552F12" />
    </linearGradient>
    <!-- Gold / Brass metal gradient -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6F4E07" />
    </linearGradient>
    <!-- Leather handle gradient -->
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#552F12" />
      <stop offset="50%" stop-color="#8F5428" />
      <stop offset="100%" stop-color="#552F12" />
    </linearGradient>
    <!-- Red label gradient -->
    <linearGradient id="red-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D94343" />
      <stop offset="100%" stop-color="#9C1E1E" />
    </linearGradient>
    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="sticker-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <filter id="handle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="315" rx="160" ry="20" fill="#000000" opacity="0.15" filter="blur(8px)" />

  <!-- Main Suitcase Group -->
  <g filter="url(#shadow)">
    <!-- Base Body Back Plate -->
    <rect x="42" y="82" width="316" height="226" rx="28" fill="#122B1E" />
    
    <!-- Main Suitcase Body -->
    <rect x="44" y="84" width="312" height="222" rx="26" fill="url(#suitcase-grad)" stroke="#1A3B28" stroke-width="2" />
    
    <!-- Inner soft highlight overlay for extra 3D depth -->
    <rect x="48" y="88" width="304" height="100" rx="22" fill="url(#suitcase-highlight)" pointer-events="none" />

    <!-- Corner protectors (Brass studs) -->
    <!-- Top-Left Corner -->
    <path d="M 44 114 A 30 30 0 0 1 74 84 L 74 96 A 18 18 0 0 0 56 114 Z" fill="url(#brass-grad)" stroke="#1E1404" stroke-width="0.5" />
    <circle cx="56" cy="96" r="3" fill="#FFEAA7" opacity="0.7" />
    
    <!-- Top-Right Corner -->
    <path d="M 356 114 A 30 30 0 0 0 326 84 L 326 96 A 18 18 0 0 1 344 114 Z" fill="url(#brass-grad)" stroke="#1E1404" stroke-width="0.5" />
    <circle cx="344" cy="96" r="3" fill="#FFEAA7" opacity="0.7" />

    <!-- Bottom-Left Corner -->
    <path d="M 44 276 A 30 30 0 0 0 74 306 L 74 294 A 18 18 0 0 1 56 276 Z" fill="url(#brass-grad)" stroke="#1E1404" stroke-width="0.5" />
    <circle cx="56" cy="294" r="3" fill="#FFEAA7" opacity="0.7" />

    <!-- Bottom-Right Corner -->
    <path d="M 356 276 A 30 30 0 0 1 326 306 L 326 294 A 18 18 0 0 0 344 276 Z" fill="url(#brass-grad)" stroke="#1E1404" stroke-width="0.5" />
    <circle cx="344" cy="294" r="3" fill="#FFEAA7" opacity="0.7" />

    <!-- Horizontal wood/metal vintage bands -->
    <rect x="44" y="112" width="312" height="6" fill="#122B1E" opacity="0.4" />
    <rect x="44" y="268" width="312" height="6" fill="#122B1E" opacity="0.4" />

    <!-- Leather Vertical Straps -->
    <!-- Left Strap -->
    <g>
      <rect x="94" y="80" width="28" height="230" rx="4" fill="url(#strap-grad)" stroke="#3E200C" stroke-width="1.5" />
      <!-- Stitch lines -->
      <line x1="98" y1="84" x2="98" y2="306" stroke="#FFE9D2" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      <line x1="118" y1="84" x2="118" y2="306" stroke="#FFE9D2" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      
      <!-- Strap holes -->
      <circle cx="108" cy="115" r="2.5" fill="#1A0D06" />
      <circle cx="108" cy="140" r="2.5" fill="#1A0D06" />
      <circle cx="108" cy="250" r="2.5" fill="#1A0D06" />
      <circle cx="108" cy="275" r="2.5" fill="#1A0D06" />

      <!-- Left Metal Strap Loop/Buckles -->
      <rect x="90" y="165" width="36" height="24" rx="3" fill="url(#brass-grad)" stroke="#221102" stroke-width="1" />
      <rect x="98" y="171" width="20" height="12" rx="1" fill="#1E1404" />
      <!-- Buckle prongs -->
      <line x1="108" y1="163" x2="108" y2="183" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right Strap -->
    <g>
      <rect x="278" y="80" width="28" height="230" rx="4" fill="url(#strap-grad)" stroke="#3E200C" stroke-width="1.5" />
      <!-- Stitch lines -->
      <line x1="282" y1="84" x2="282" y2="306" stroke="#FFE9D2" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      <line x1="302" y1="84" x2="302" y2="306" stroke="#FFE9D2" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      
      <!-- Strap holes -->
      <circle cx="292" cy="115" r="2.5" fill="#1A0D06" />
      <circle cx="292" cy="140" r="2.5" fill="#1A0D06" />
      <circle cx="292" cy="250" r="2.5" fill="#1A0D06" />
      <circle cx="292" cy="275" r="2.5" fill="#1A0D06" />

      <!-- Right Metal Strap Loop/Buckles -->
      <rect x="274" y="165" width="36" height="24" rx="3" fill="url(#brass-grad)" stroke="#221102" stroke-width="1" />
      <rect x="282" y="171" width="20" height="12" rx="1" fill="#1E1404" />
      <!-- Buckle prongs -->
      <line x1="292" y1="163" x2="292" y2="183" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Center Brass Lock -->
    <g>
      <!-- Main plate -->
      <rect x="176" y="165" width="48" height="40" rx="6" fill="url(#brass-grad)" stroke="#221102" stroke-width="1.5" />
      <!-- Lock circle -->
      <circle cx="200" cy="185" r="12" fill="#5F4B0E" stroke="#221102" stroke-width="1" />
      <rect x="198" y="181" width="4" height="11" rx="1" fill="#110802" />
      <circle cx="200" cy="192" r="2.5" fill="#110802" />
    </g>

    <!-- Top Handle Mounts -->
    <g filter="url(#handle-shadow)">
      <!-- Left mount -->
      <rect x="134" y="74" width="18" height="14" rx="2" fill="url(#brass-grad)" stroke="#221102" stroke-width="1" />
      <!-- Right mount -->
      <rect x="248" y="74" width="18" height="14" rx="2" fill="url(#brass-grad)" stroke="#221102" stroke-width="1" />
      
      <!-- Rounded heavy Handle -->
      <path d="M 143 76 Q 200 45 257 76 C 265 82 255 86 251 84 Q 200 58 149 84 C 145 86 135 82 143 76" fill="url(#handle-grad)" stroke="#3E200C" stroke-width="2" />
    </g>
  </g>

  <!-- SINGLE PROMINENT DIAGONAL IDEMO LABEL -->
  <g transform="translate(196, 142) rotate(-14)" filter="url(#sticker-shadow)">
    <!-- Shadow background plate -->
    <rect x="-72" y="-22" width="144" height="44" rx="4" fill="#000000" opacity="0.15" />
    <!-- Sticker background -->
    <rect x="-70" y="-24" width="140" height="44" rx="3" fill="#FFFDF9" stroke="#E53E3E" stroke-width="3.5" />
    <!-- Inner soft frame -->
    <rect x="-65" y="-19" width="130" height="34" rx="1" fill="none" stroke="#E53E3E" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.6" />
    <!-- Main crisp IDEMO text -->
    <text x="0" y="7" font-family="'Space Grotesk', 'Inter', 'Helvetica Neue', sans-serif" font-weight="950" font-size="20" fill="#111111" letter-spacing="3.5" text-anchor="middle">IDEMO</text>
  </g>
</svg>
